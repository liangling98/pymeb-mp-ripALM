name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Run test suite
        run: python -m pytest

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build source archive and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel and test dependencies
        run: python -m pip install dist/*.whl pytest "matplotlib>=3.8"
      - name: Test from the source archive
        shell: bash
        run: |
          archive_dir=$(mktemp -d)
          tar -xzf dist/*.tar.gz -C "$archive_dir"
          cd "$archive_dir"/pymeb_ripalm-*
          python -m pytest
          python examples/quickstart.py
