[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymeb-ripalm"
version = "0.1.0"
description = "GPU-capable ripALM solvers for minimum enclosing balls of balls"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
  {name = "Ling Liang", email = "liang.ling@u.nus.edu"},
  {name = "Lei Yang", email = "yanglei39@mail.sysu.edu"},
]
keywords = [
  "minimum enclosing ball",
  "optimization",
  "mixed precision",
  "GPU",
  "PyTorch",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["torch>=2.2"]

[project.urls]
Repository = "https://github.com/liangling98/pymeb-mp-ripALM"
Issues = "https://github.com/liangling98/pymeb-mp-ripALM/issues"

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = [
  "pytest>=8",
  "pytest-cov>=5",
]
experiments = [
  "huggingface-hub>=0.20",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "pillow>=10",
  "pyarrow>=14",
  "requests>=2.31",
  "torchvision>=0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
source = ["pymeb"]
